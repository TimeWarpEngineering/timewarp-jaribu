name: CI/CD Workflow

# No paths filter. A filtered workflow never reports a status, so a required
# check on a docs-only pull request would stay pending.

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
      - 'feature/**'
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      mode:
        description: 'merge = normal CI (default). probe = trusted-publishing check only (OIDC login, no build, no publish).'
        type: choice
        options:
          - merge
          - probe
        default: merge

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    shell: pwsh

jobs:
  test:
    name: test (${{ matrix.os }})
    if: github.event_name != 'release' && (github.event_name != 'workflow_dispatch' || inputs.mode != 'probe')
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: Install dotnet-coverage
        run: dotnet tool install --global dotnet-coverage

      - name: Run CI pipeline
        run: dotnet run tools/dev-cli/dev.cs -- workflow

      # upload-artifact v4+ rejects a second upload of the same name, so each OS keeps its own.
      - name: coverage
        if: success()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.os }}
          path: artifacts/coverage
          if-no-files-found: warn

  release:
    name: release
    if: github.event_name == 'release' || (github.event_name == 'workflow_dispatch' && inputs.mode == 'probe')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        if: github.event_name == 'release'
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Cache NuGet packages
        if: github.event_name == 'release'
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-

      - name: NuGet login (OIDC Trusted Publishing)
        id: nuget-login
        uses: nuget/login@v1
        with:
          user: TimeWarp.Enterprises

      - name: Trusted publishing probe result
        if: github.event_name == 'workflow_dispatch' && inputs.mode == 'probe'
        run: echo "Trusted publishing OK — OIDC exchange succeeded for this repo + workflow.yml. (A failure of the NuGet login step above means the policy is missing or misconfigured on NuGet.org.)"

      - name: Run release pipeline
        if: github.event_name == 'release'
        env:
          NUGET_API_KEY: ${{ steps.nuget-login.outputs.NUGET_API_KEY }}
        run: dotnet run tools/dev-cli/dev.cs -- workflow

      - name: Upload packages
        if: github.event_name == 'release'
        uses: actions/upload-artifact@v7
        with:
          name: Packages-${{ github.run_number }}
          path: artifacts/packages/*.nupkg
          if-no-files-found: error
