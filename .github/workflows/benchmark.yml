name: Benchmark

# Off the pull-request path. The comparison is a manual run or a nightly run.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: pwsh

jobs:
  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          # Same 11.0.x preview channel as workflow.yml, until 11 GA.
          # The next step pins global.json so the muxer selects that SDK.
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Pin the benchmark SDK
        env:
          INSTALLED_SDK: ${{ steps.setup-dotnet.outputs.dotnet-version }}
        run: |
          $ErrorActionPreference = 'Stop'
          $installed = $env:INSTALLED_SDK.Trim()
          if (-not $installed.StartsWith('11.0.')) {
            throw "setup-dotnet must install an 11.0 SDK, found '$installed'"
          }
          $path = Join-Path (Get-Location) 'global.json'
          $document = Get-Content -Raw -Path $path | ConvertFrom-Json
          $runner = $null
          if ($null -ne $document.test) {
            $runner = $document.test.runner
          }
          if ($runner -ne 'Microsoft.Testing.Platform') {
            throw "test.runner must stay Microsoft.Testing.Platform, found '$runner'"
          }
          $sdk = [pscustomobject]@{
            version = $installed
            rollForward = 'disable'
          }
          if ($null -eq $document.PSObject.Properties['sdk']) {
            $document | Add-Member -NotePropertyName sdk -NotePropertyValue $sdk
          }
          else {
            $document.sdk = $sdk
          }
          $json = ($document | ConvertTo-Json -Depth 10) + "`n"
          [System.IO.File]::WriteAllText($path, $json)
          $selected = (dotnet --version).Trim()
          if ($LASTEXITCODE -ne 0) {
            throw "dotnet --version failed: '$selected'"
          }
          Write-Host "Selected SDK: $selected"
          if ($selected -ne $installed) {
            throw "dotnet --version '$selected' does not match installed SDK '$installed'"
          }

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-bench-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-bench-

      - name: Run benchmark
        run: dotnet run tools/dev-cli/dev.cs -- benchmark --runs 3

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_number }}
          path: benchmarks/results/*.md
          if-no-files-found: warn
