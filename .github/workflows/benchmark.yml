name: Benchmark

# Off the pull-request path. The comparison is a manual run or a nightly run.
on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * *'

permissions:
  contents: read

jobs:
  benchmark:
    name: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup .NET
        id: setup-dotnet
        uses: actions/setup-dotnet@v6
        with:
          # Same 11.0.x preview channel as workflow.yml, until 11 GA.
          # The next step pins global.json so the muxer selects that SDK.
          dotnet-version: '11.0.x'
          dotnet-quality: 'preview'

      - name: Pin the benchmark SDK
        env:
          INSTALLED_SDK: ${{ steps.setup-dotnet.outputs.dotnet-version }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          version = os.environ["INSTALLED_SDK"].strip()
          if not version.startswith("11.0."):
              raise SystemExit(
                  f"setup-dotnet must install an 11.0 SDK, found {version!r}"
              )
          path = Path("global.json")
          document = json.loads(path.read_text())
          document["sdk"] = {"version": version, "rollForward": "disable"}
          runner = document.get("test", {}).get("runner")
          if runner != "Microsoft.Testing.Platform":
              raise SystemExit(
                  f"test.runner must stay Microsoft.Testing.Platform, found {runner!r}"
              )
          path.write_text(json.dumps(document, indent=2) + "\n")
          PY
          version="$(dotnet --version)"
          echo "Selected SDK: ${version}"
          test "${version}" = "${INSTALLED_SDK}"

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-bench-${{ hashFiles('Directory.Packages.props', '**/*.csproj', '**/*.props') }}
          restore-keys: ${{ runner.os }}-nuget-bench-

      - name: Run benchmark
        run: dotnet run tools/dev-cli/dev.cs -- benchmark --runs 3

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-results-${{ github.run_number }}
          path: benchmarks/results/*.md
          if-no-files-found: warn
